name: tsschecker - check signing / save blobs
on:
  workflow_dispatch:
    inputs:
      ecid:
        description: "ECID（十六进制如 0x80301a1b2c3d4，或十进制）。留空则只检查签名状态。"
        required: false
        default: ""
      generator:
        description: "Generator（checkm8 pwned DFU 用）"
        required: false
        default: "0x1111111111111111"
      apnonce:
        description: "可选：显式 ApNonce（64 位 hex）。留空则由 generator 推导"
        required: false
        default: ""
jobs:
  tss:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 获取 tsschecker（优先官方预编译，失败则源码编译）
        run: |
          set -e
          curl -fsSL -o /tmp/tc.zip \
            https://github.com/tihmstar/tsschecker/releases/download/347/buildroot_ubuntu-latest.zip || true
          if [ -s /tmp/tc.zip ]; then
            unzip -oq /tmp/tc.zip -d /tmp/tcbuild || true
            if [ -f /tmp/tcbuild/buildroot_ubuntu-latest/usr/local/bin/tsschecker ]; then
              sudo cp /tmp/tcbuild/buildroot_ubuntu-latest/usr/local/bin/tsschecker /usr/local/bin/ || true
              sudo chmod +x /usr/local/bin/tsschecker || true
            fi
          fi
          if ! tsschecker --help > /dev/null 2>&1; then
            echo "== 预编译不可用，改为源码编译 =="
            sudo apt-get update -qq
            sudo apt-get install -y build-essential autoconf automake libtool pkg-config \
              libcurl4-openssl-dev libplist-dev libssl-dev libusb-1.0-0-dev libimobiledevice-dev libzip-dev
            git clone --recursive --depth 1 https://github.com/tihmstar/libfragmentzip.git
            cd libfragmentzip && ./autogen.sh && make -j$(nproc) && sudo make install && sudo ldconfig && cd ..
            git clone --recursive --depth 1 https://github.com/tihmstar/tsschecker.git
            cd tsschecker && ./autogen.sh && make -j$(nproc) && sudo make install && sudo ldconfig
          fi
          echo "== tsschecker 就绪 =="
          tsschecker --help | head -6

      - name: 检查签名状态（Erase 票）
        run: tsschecker -d AppleTV6,2 -m BuildManifest.plist -b --nocache || true

      - name: 检查签名状态（Update 票）
        run: tsschecker -d AppleTV6,2 -m BuildManifest.plist -b -u --nocache || true

      - name: 抓取 SHSH2 blob
        if: github.event.inputs.ecid != ''
        env:
          ECID: ${{ github.event.inputs.ecid }}
          GEN: ${{ github.event.inputs.generator }}
          APNONCE: ${{ github.event.inputs.apnonce }}
        run: |
          set -x
          EXTRA=""
          if [ -n "$APNONCE" ]; then EXTRA="--apnonce $APNONCE"; fi
          mkdir -p blobs/erase blobs/update
          tsschecker -d AppleTV6,2 -m BuildManifest.plist -b -e "$ECID" -g "$GEN" $EXTRA --save=blobs/erase/
          tsschecker -d AppleTV6,2 -m BuildManifest.plist -b -u -e "$ECID" -g "$GEN" $EXTRA --save=blobs/update/
          ls -lR blobs/
          sha256sum blobs/*/*.shsh2 || true

      - name: 上传 blob
        if: github.event.inputs.ecid != ''
        uses: actions/upload-artifact@v4
        with:
          name: shsh2-blobs
          path: blobs/
          if-no-files-found: error
          retention-days: 30
